<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rover Lab: Engineer Edition</title>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#120f24;--panel:#1c1838;--line:#38326f;--ink:#ecebff;--dim:#a29fd0;--acc:#c6ff4a;
--motion:#4c97ff;--control:#ffab19;--sensing:#5cb1d6;--vars:#ff8c1a;--events:#ffbf00;--my:#ff6680;--cs:calc(min(92vw,440px)/8)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font:500 16px/1.45 'Chakra Petch',system-ui,sans-serif;padding:env(safe-area-inset-top,0) 12px env(safe-area-inset-bottom,0)}
.wrap{max-width:1020px;margin:0 auto}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:12px 0}
h1{font-size:1.5rem;margin:0}h1 span{color:var(--acc)}
.pill{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:4px 12px;color:var(--ink);font:inherit;font-size:.9rem;cursor:pointer}
nav{display:flex;gap:6px;flex-wrap:wrap;width:100%}
nav button{width:42px;height:42px;border-radius:8px;border:2px solid var(--line);background:var(--panel);color:var(--ink);font:700 1rem inherit;cursor:pointer}
nav button.done{background:#245a2f;border-color:#53c06a}nav button.cur{border-color:var(--acc);box-shadow:0 0 0 2px #c6ff4a55}
#brief{background:var(--panel);border-left:5px solid var(--acc);border-radius:8px;padding:12px 16px;margin:8px 0 14px}
#brief h2{margin:0 0 2px;font-size:1.25rem}#brief p{margin:0}
details{margin-top:6px;color:var(--dim);font-size:.9rem}summary{cursor:pointer}
.main{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:start}
@media(max-width:840px){.main{grid-template-columns:1fr}}
#stagebox{display:flex;flex-direction:column;gap:8px;align-items:center}
#stage{position:relative;width:calc(var(--cs)*8);height:calc(var(--cs)*8);border-radius:10px;overflow:hidden;border:3px solid var(--line);
background:linear-gradient(#0000 calc(100% - 1px),#ffffff1c 0) 0 0/100% var(--cs),linear-gradient(90deg,#0000 calc(100% - 1px),#ffffff1c 0) 0 0/var(--cs) 100%,#0b0919}
.sp{position:absolute;width:var(--cs);height:var(--cs);display:flex;align-items:center;justify-content:center;font-size:calc(var(--cs)*.6);transition:left .3s,top .3s}
#bot{z-index:3}.arr{position:absolute;inset:0;display:flex;justify-content:center;color:var(--acc);font-style:normal;font-size:calc(var(--cs)*.3);line-height:1;transition:transform .3s}
.shake{animation:sh .35s}@keyframes sh{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
@media(prefers-reduced-motion:reduce){.shake{animation:none}.sp,.arr{transition:none}}
#hud{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 14px;font-size:.9rem;color:var(--dim)}#hud b{color:var(--ink)}
#msg{min-height:3em;max-width:calc(var(--cs)*8);text-align:center}#msg.bad{color:#ff8f8f}#msg.good{color:#8fe8a5}
.panel{background:var(--panel);border-radius:10px;padding:12px;border:1px solid var(--line)}
.lab{display:flex;justify-content:space-between;color:var(--dim);font-size:.85rem;margin:2px 0 6px}
#tabs{display:flex;gap:6px;margin-bottom:6px}#tabs button{border:0;border-radius:8px 8px 0 0;padding:6px 14px;background:#2a2558;color:var(--ink);font:700 .9rem inherit;cursor:pointer}#tabs button.on{background:#0b1424;color:var(--acc)}
#script{min-height:170px;max-height:50vh;overflow:auto;background:#0b1424;border-radius:8px;padding:10px;margin-bottom:10px}
.hat{display:inline-block;background:var(--events);color:#3a2c00;font-weight:700;border-radius:14px 14px 4px 4px;padding:6px 12px;margin-bottom:4px}.hat.fn{background:var(--my);color:#3a0010}
.blk{margin:3px 0;border-radius:6px;color:#fff;border:1px solid #0004}
.blk.motion{background:var(--motion)}.blk.control{background:var(--control);color:#2f1c00}.blk.sensing{background:var(--sensing);color:#052836}.blk.vars{background:var(--vars);color:#2f1600}.blk.my{background:var(--my);color:#3a0010}
.blk.on{outline:3px solid #fff;box-shadow:0 0 12px #fff8}
.row{display:flex;align-items:center;gap:6px;padding:7px 10px;font-weight:700;min-height:42px;flex-wrap:wrap}
.row button{border:0;border-radius:99px;background:#0003;color:inherit;font:700 .95rem inherit;padding:2px 10px;min-height:28px;cursor:pointer}.row .x{margin-left:auto;width:28px;padding:0}
.zone{margin:0 8px 8px 22px;padding:4px 6px;border-left:6px solid #0003;background:#0002;border-radius:0 6px 6px 0;min-height:34px;cursor:pointer}.zone.tgt{background:#fff3;border-left-color:#fff}
.zone:empty::before{content:'drop blocks here';font-size:.8rem;opacity:.75;font-weight:500}
.els{margin:0 8px 0 22px;font-weight:700;font-size:.9rem}
.pal{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.pal button{border:0;border-radius:6px;padding:10px 12px;min-height:46px;font:700 .95rem inherit;cursor:pointer;color:#fff}
.pal .motion{background:var(--motion)}.pal .control{background:var(--control);color:#2f1c00}.pal .sensing{background:var(--sensing);color:#052836}.pal .vars{background:var(--vars);color:#2f1600}.pal .my{background:var(--my);color:#3a0010}
.pal button:disabled{opacity:.3;cursor:not-allowed}
.ctl{display:flex;gap:8px}.ctl button{flex:1;border:0;border-radius:8px;padding:12px;font:700 1.05rem inherit;cursor:pointer}
#run{background:var(--acc);color:#1b2a00}#run.stop{background:#e04b4b;color:#fff}#reset{background:#3a3578;color:#fff}#clear{background:#4a2a3a;color:#fff}
pre{margin:6px 0 0;padding:10px;background:#0b1424;border-radius:8px;color:#b9f27a;font:13px/1.5 ui-monospace,Menlo,Consolas,monospace;overflow:auto;max-height:240px}
button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.row,.pal button{cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
body.dragging,body.dragging *{cursor:grabbing!important;user-select:none}
.ghost{position:fixed;z-index:50;pointer-events:none;padding:8px 14px;font-weight:700;opacity:.93;box-shadow:0 10px 24px #000a;transform:rotate(-2deg)}
.ph{height:12px;margin:3px 0;border-radius:6px;background:var(--acc);box-shadow:0 0 10px var(--acc)}
.zone.over{background:#ffffff40}
#pal.trash{outline:3px dashed #ff6a6a;outline-offset:5px;border-radius:8px}
#ov{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:16px;z-index:20}#ov.show{display:flex}
#card{background:#f4f3ff;color:#120f24;border-radius:14px;padding:24px;max-width:460px;width:100%;text-align:center}
#card h2{margin:0 0 6px;font-size:1.7rem}.big{font-size:2.6rem}
#card button,#card input{font:700 1.05rem inherit;border-radius:8px;padding:10px 20px;border:2px solid #120f24;margin:6px 4px}#card button{background:#120f24;color:#fff;cursor:pointer}
.cert{border:5px double #ffab19;border-radius:10px;padding:14px;margin:10px 0}
@media print{body{background:#fff}.wrap>*:not(#ov){display:none}#ov{position:static;background:none;display:block}#card button,#card input{display:none}}
</style>
</head>
<body>
<div class="wrap">
<header>
<h1>🤖 Rover Lab: <span>Engineer Edition</span></h1>
<span class="pill" id="clock">⏱ 00:00</span>
<span><button class="pill" id="spd">🐢 Normal speed</button> <button class="pill" id="mute">🔊 Sound on</button></span>
<nav id="nav" aria-label="Missions"></nav>
</header>
<div id="brief"><h2 id="st"></h2><p id="sp"></p><details><summary>Teacher notes</summary><span id="tip"></span></details></div>
<div class="main">
<div id="stagebox"><div id="stage" aria-label="Rover map"></div>
<div id="hud"><span>⛽ Fuel <b id="hf">0</b></span><span>count <b id="hs">0</b></span><span>💎 <b id="hp">0/0</b></span><span>Blocks <b id="hb">0</b></span></div>
<div id="msg" role="status"></div></div>
<div class="panel">
<div class="lab"><span>Build your program: drag blocks in, drag to reorder, drop on the palette to delete</span><span id="cnt"></span></div>
<div id="tabs"></div>
<div id="script" aria-label="Your program"></div>
<div class="lab"><span>Blocks</span></div>
<div class="pal" id="pal"></div>
<div class="ctl"><button id="run">▶ Run</button><button id="reset">↺ Reset</button><button id="clear">🗑 Clear</button></div>
<details><summary>See your code as Python</summary><pre id="py"></pre></details>
</div></div></div>
<div id="ov"><div id="card"></div></div>

var x=document.createElement('button');x.className='x';x.textContent='✕';x.setAttribute('aria-label','Remove block');x.onclick=function(e){e.stopPropagation();if(running)return;tgt=rm(script,n)||rm(fnS,n)||root();rs()};h.appendChild(x);w.appendChild(h);
if(b.C){var z=zone(n.body);rl(n.body,z);w.appendChild(z);if(b.E){var e2=document.createElement('div');e2.className='els';e2.textContent='else';w.appendChild(e2);var z2=zone(n.els);rl(n.els,z2);w.appendChild(z2)}}
cont.appendChild(w)})}

function renderScript(){var s=$('#script'),r0=root();s.innerHTML='<div class="hat'+(ed==='fn'?' fn':'')+'">'+(ed==='fn'?'define 🧩 my block':'when 🏁 clicked')+'</div>';var r=document.createElement('div');r.className='zone'+(tgt===r0?' tgt':'');r.style.marginLeft='0';r._list=r0;r.style.minHeight='110px';r.onclick=function(){if(!running){tgt=r0;rs()}};rl(r0,r);s.appendChild(r)}
function renderPal(){var p=$('#pal');p.innerHTML='';var L=LV[cur],full=total()>=L.max;L.allow.forEach(function(k){var b=document.createElement('button');b.className=B[k].c;b.textContent=(B[k].i?B[k].i+' ':'')+B[k].n;b.disabled=running||full;
b.addEventListener('pointerdown',function(e){startDrag(e,{kind:k,label:b.textContent,cls:B[k].c})});b.onclick=function(){if(dragged)return;var n=mk(k);tgt.push(n);if(B[k].C)tgt=n.body;beep(500,.06);rs()};p.appendChild(b)})}
function py(l,d){var p='    '.repeat(d);if(!l.length)return p+'pass\n';return l.map(function(n){var t=n.t;if(PS[t])return p+PS[t]+'\n';
var h=t==='rep'?'for _ in range('+n.n+'):':t==='until'?'while not '+PC[n.cond]+':':'if '+PC[n.cond]+':';
return p+h+'\n'+py(n.body,d+1)+(t==='ifelse'?p+'else:\n'+py(n.els,d+1):'')}).join('')}
function toPy(){var L=LV[cur],s='';if(L.fn)s+='def my_block():\n'+py(fnS,1)+'\n';if(has(script,['add'])||has(fnS,['add']))s+='count = 0\n';return s+py(script,0)}
function hl(id){document.querySelectorAll('#script .blk').forEach(function(e){e.classList.toggle('on',id&&e.dataset.id==id)})}
function blocked(x,y){return x<0||y<0||x>7||y>7||LV[cur].rocks.some(function(r){return r[0]===x&&r[1]===y})}
function sampleAt(){var L=LV[cur];for(var i=0;i<L.samples.length;i++)if(!S.got[i]&&L.samples[i][0]===S.x&&L.samples[i][1]===S.y)return i;return -1}
function test(c){var L=LV[cur],d=S.d;
if(c==='wall')return blocked(S.x+DX[d],S.y+DY[d]);if(c==='clear')return!blocked(S.x+DX[d],S.y+DY[d]);
if(c==='rclear'){d=(d+1)%4;return!blocked(S.x+DX[d],S.y+DY[d])}if(c==='lclear'){d=(d+3)%4;return!blocked(S.x+DX[d],S.y+DY[d])}
if(c==='sample')return sampleAt()>-1;if(c==='n3')return S.n>=3;return!!L.goal&&S.x===L.goal[0]&&S.y===L.goal[1]}
var sleep=function(ms){return new Promise(function(r){setTimeout(r,ms)})};
function place(){var b=$('#bot');b.style.left='calc(var(--cs)*'+S.x+')';b.style.top='calc(var(--cs)*'+S.y+')';b.querySelector('.arr').style.transform='rotate('+S.ang+'deg)'}
function fail(m){throw{fail:m}}
async function ex(l){for(var i=0;i<l.length;i++)await one(l[i])}
async function one(n){if(!running)throw{stop:1};if(++S.steps>1500)fail('The program never stopped. Check your loop condition 🔁');hl(n.id);var t=n.t;
if(t==='fwd'){var nx=S.x+DX[S.d],ny=S.y+DY[S.d];
if(blocked(nx,ny)){$('#bot').classList.add('shake');beep(140,.25);await sleep(400);fail('💥 Bump! The rover hit a wall. Use a sensor or fix the path.')}
if(S.fuel<=0)fail('⛽ Out of fuel! Find a shorter route or a smarter algorithm.');
S.fuel--;S.x=nx;S.y=ny;place();hud();beep(380,.06);await sleep(D)}
else if(t==='left'||t==='right'){S.d=(S.d+(t==='left'?3:1))%4;S.ang+=t==='left'?-90:90;place();beep(300,.05);await sleep(D*.7)}
else if(t==='pick'){var i=sampleAt();if(i<0)fail('No sample here! Ask the sensor first with an if block 🔍');S.got[i]=1;$('#sm'+i).style.visibility='hidden';beep(900,.15);hud();await sleep(D*.6)}
else if(t==='add'){S.n++;hud();beep(700,.08);await sleep(D*.5)}
else if(t==='call'){await ex(fnS);hl(n.id)}
else if(t==='rep'){for(var k=0;k<n.n;k++){await ex(n.body);hl(n.id)}}
else if(t==='until'){while(!test(n.cond)){if(++S.steps>1500)fail('The program never stopped. Check your loop condition 🔁');await ex(n.body);hl(n.id);await sleep(50)}}
else{await sleep(D*.4);if(test(n.cond))await ex(n.body);else if(t==='ifelse')await ex(n.els)}}
function chk(){var L=LV[cur],g=Object.keys(S.got).length;
if(L.need==='free'){if(total()<8)return'Use at least 8 blocks.';if(!has(script.concat(fnS),['rep','until']))return'Add a loop block.';if(!has(script.concat(fnS),['if','ifelse']))return'Add an if block with a sensor.';if(!has(script.concat(fnS),['add']))return'Use the count variable (change count by 1).';if(!has(script,['call']))return'Call your own 🧩 block from the main program.';return''}
if(S.x!==L.goal[0]||S.y!==L.goal[1])return'The rover stopped at column '+(S.x+1)+', row '+(S.y+1)+'. It is not at the base yet.';
if(L.need==='quota'&&g!==3)return'You picked up '+g+' samples but the quota is exactly 3.';
if(L.need==='laps'&&S.n!==3)return'count is '+S.n+' but it should be 3 (one for each lap).';
if(L.need==='recur'&&!has(fnS,['call']))return'Almost! Your 🧩 block needs to call itself.';
if(L.need!=='quota'&&g<L.samples.length)return'Some samples are still out there 💎 ('+g+'/'+L.samples.length+'). Find the ones you missed.';return''}
async function run(){if(running){running=false;return}
if(!script.length){msg('Add some blocks to the main program first!','bad');return}
drawStage();running=true;$('#run').textContent='■ Stop';$('#run').className='stop';renderPal();msg('Running...');
try{await ex(script);var e=chk();if(e)msg(e,'bad');else win()}
catch(x){if(x.fail)msg(x.fail,'bad');else if(x.stop)msg('Stopped.');else throw x}
running=false;hl(null);$('#run').textContent='▶ Run';$('#run').className='';renderPal();$('#bot').classList.remove('shake')}

var c=$('#card');
if(cur===LV.length-1){c.innerHTML='<div class="big">🏆</div><h2>Engineering complete!</h2><div class="cert"><p>This certificate is awarded to</p><h2 id="nm">Rover Engineer</h2><p>for mastering functions, variables, loops, sensors and algorithms in Rover Lab.</p></div><input id="name" placeholder="Type your name" maxlength="24" aria-label="Your name"><br><button id="pr">🖨 Print</button><button id="again">Play again</button>';
$('#name').oninput=function(){$('#nm').textContent=this.value||'Rover Engineer'};$('#pr').onclick=function(){window.print()};$('#again').onclick=function(){done={};$('#ov').classList.remove('show');load(0)}}
else{c.innerHTML='<div class="big">✅</div><h2>Mission complete!</h2><p>'+(ok?'Efficient solution: '+total()+' blocks, '+(L.fuel-S.fuel)+' fuel used.':'It works with '+total()+' blocks. Can you do it in '+L.par+' or fewer?')+'</p><button id="nx">Next mission ▶</button><button id="rt">Stay here</button>';
$('#nx').onclick=function(){$('#ov').classList.remove('show');load(cur+1)};$('#rt').onclick=function(){$('#ov').classList.remove('show')}}
$('#ov').classList.add('show');setTimeout(function(){var f=c.querySelector('button');if(f)f.focus()},50)}
var dragged=false;

function startDrag(e,d){if(running||(e.pointerType==='mouse'&&e.button!==0))return;
var x0=e.clientX,y0=e.clientY,on=false,ghost=null,ph=null,z0=null,idx=0,trash=false;
function clear(){if(ph){ph.remove();ph=null}document.querySelectorAll('.zone.over').forEach(function(z){z.classList.remove('over')});$('#pal').classList.remove('trash');z0=null;trash=false}

if(!on){if(Math.hypot(ev.clientX-x0,ev.clientY-y0)<7)return;on=true;dragged=true;document.body.classList.add('dragging');
ghost=document.createElement('div');ghost.className='ghost blk '+(d.node?B[d.node.t].c:d.cls);

ghost.style.left=(ev.clientX+10)+'px';ghost.style.top=(ev.clientY+10)+'px';
clear();var els=document.elementsFromPoint(ev.clientX,ev.clientY),z=null;
for(var i=0;i<els.length;i++){var q=els[i];if(q.classList&&q.classList.contains('zone')&&!(d.el&&d.el.contains(q))){z=q;break}}
if(z){z0=z;var kids=z.querySelectorAll(':scope > .blk');idx=kids.length;
